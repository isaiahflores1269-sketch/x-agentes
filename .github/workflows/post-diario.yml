name: Posts diarios en X (3 al día)
on:
  schedule:
    - cron: "17 8,13,19 * * *"   # 9:17, 14:17 y 20:17 en Madrid (invierno)
  workflow_dispatch:
    inputs:
      solo_prueba:
        description: "1 = generar sin publicar"
        default: "1"
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests-oauthlib
      - run: python agente.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          SOLO_PRUEBA: ${{ github.event.inputs.solo_prueba || '0' }}
